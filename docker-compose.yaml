version: "3.8"
services:
  nuxt:
    build:
      context: .
    image: lukiuwuxyz:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - SPOTIFY_CLIENT_ID=
      - SPOTIFY_CLIENT_SECRET=
      - SPOTIFY_REFRESH_TOKEN=
      - SPOTIFY_MODE=
      - SPOTIFY_PAAPER_USERNAME=
      - SPOTIFY_PAAPER_URL=